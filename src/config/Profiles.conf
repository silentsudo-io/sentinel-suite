# Sentinel per-account profiles — edit here or via the dashboard Accounts tab.
#
# GRAMMAR (authoritative: SentinelRiskService.LoadProfilesIfChanged)
#   account=<name>|firm=lucid|bulenox|tpt|apex|custom
#     size=<mult>          position-size multiplier (1.0 = full)
#     contracts=<int>      max contracts (0 = no limit)
#     ratio=<R>            consistency ratio;  cap = ratio x target
#     target=<$>           eval / payout target
#     manualDaily=<$>      override daily cap (0 = use ratio x target); cap = min(manualDaily, ratio x target)
#     dailyLoss=<$>        governor daily loss stop
#     ddType=trailing|static|eod
#     ddAmt=<$>            trailing-drawdown threshold (0 = OFF, no DD tracking)
#     ddFlat=<$>           $ ABOVE the floor to auto-flatten (requires hardEnforce=true); 0 = flatten AT the floor
#     hardEnforce=true     ARM auto-flatten + lockout at the loss stop (default false = advisory only)
#     session=24h          or HH:MM-HH:MM
#   Unknown keys are ignored. Lines starting with # or // are comments.
#   NOTE: resetHour= is GLOBAL, not per-account — LAST LINE WINS. Not set here on purpose.
#
# ACCOUNT NAMING (naming federation §7): NinjaTrader AUTO-PREFIXES "Sim" to every simulation
#   account. Type only the <LANE>-<SLOT> into NT's dialog -> it stores "Sim<LANE>-<SLOT>".
#   Lanes: LAB (A/B arms) · COPY (LEAD/F1/F2) · PROP (firm rehearsal) · HAND (Deck) · BURN (safety proofs).

# ── LIVE / PROP (broker-assigned names, exempt from the convention) ─────────────────────────
account=LTD15081874790001|firm=lucid|ratio=0.20|target=9000|dailyLoss=1000|size=1|contracts=0|session=24h
account=TAKEPROFIT935519372|firm=tpt|ratio=0.50|target=9000|dailyLoss=1500|size=1|contracts=0|session=24h

# ── QUARANTINE ─────────────────────────────────────────────────────────────────────────────
# Sim101 is NT's built-in default: it is where an accidental strategy-enable lands. Nothing
# Sentinel may arm on it (Gate rule, execution plan step 2.4). Until that lands, quarantine it
# BEHAVIOURALLY: 1 contract, a $100 loss stop, and auto-flatten armed. An accident trips almost
# instantly and closes itself.
account=Sim101|firm=custom|ratio=1.00|target=6000|manualDaily=100|dailyLoss=100|size=1.0|contracts=1|ddAmt=0|hardEnforce=true|session=24h

# ── LAB — the A/B arms (automated: Council -> Bridge) ───────────────────────────────────────
# contracts=1 FIXES SIZE AT ONE LOT. This is deliberate: it removes position size as a
# confound, so a champion-vs-challenger difference is attributable to the POLICY, not to
# sizing. Raise it in Phase 6 when we start grading conviction -> size.
# dailyLoss is a BACKSTOP, not a prop-rule rehearsal (that is the PROP lane's job) — a tight
# governor here would truncate the training sample.
account=SimLAB-A|firm=custom|ratio=1.00|target=6000|dailyLoss=2000|size=1.0|contracts=1|ddAmt=0|hardEnforce=false|session=24h
account=SimLAB-B|firm=custom|ratio=1.00|target=6000|dailyLoss=2000|size=1.0|contracts=1|ddAmt=0|hardEnforce=false|session=24h

# ── BURN — destructive safety proofs (kill switch · auto-flatten · governor trip) ───────────
# Deliberately tiny so it TRIPS FAST. hardEnforce=true is the whole point: this is the account
# where we prove auto-flatten actually flattens. Never run a graded experiment here — tripping
# the governor poisons the P&L series and the persisted baseline.
account=SimBURN-1|firm=custom|ratio=1.00|target=1000|manualDaily=200|dailyLoss=200|size=1.0|contracts=1|ddType=trailing|ddAmt=500|ddFlat=100|hardEnforce=true|session=24h

# ── HAND — manual Deck / discretionary practice ─────────────────────────────────────────────
account=SimHAND-1|firm=custom|ratio=1.00|target=6000|dailyLoss=1000|size=1.0|contracts=2|ddAmt=0|hardEnforce=false|session=24h

# The mis-named SimSIM-* accounts (NT prepends "Sim") were deleted 2026-07-09; their interim
# profile lines are removed. EVERY account Sentinel may touch must have a line here — an
# unprofiled account is currently fail-OPEN (ungoverned), not blocked. See naming federation §7.4.
#
# contracts= is ENFORCED: SentinelCore.GateEntry hard-blocks any request above ContractLimit,
# independently of risk-sizing. No NinjaTrader-dialog cap is needed; Sentinel governs Sentinel.
# ⚠ size= (SizeScale) is NOT yet honoured by SentinelBridge — it sizes BaseQty x SizeMult directly
#   instead of calling SentinelCore.SizedQuantity(). Wired in execution-plan Phase 2.
