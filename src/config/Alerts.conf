# ═══════════════════════════════════════════════════════════════════════════
#  Sentinel Alerts channel — config for SentinelAlertService (audible + push)
#  Read once on NT startup (restart NT / F5 to re-read). All keys optional; the
#  defaults below are what applies if this file is missing entirely.
#  Sound is a NOTIFICATION only — it never acts on the account.
# ═══════════════════════════════════════════════════════════════════════════

# master switch for the whole channel
enabled=true

# also play a (soft) sound on INFO alerts (Critical always plays when enabled)
playInfo=false

# minimum seconds between sounds of the same tier (stops a burst machine-gunning the speaker)
throttleSec=3

# path to a .wav to play; empty = a distinct Windows system sound per tier
#   Critical -> SystemSounds.Hand   ·   Info -> SystemSounds.Asterisk
# e.g. critWav=C:\Users\Administrator\Documents\NinjaTrader 8\sounds\Alert4.wav
critWav=
infoWav=

# OPTIONAL PUSH: a shell command run on an alert (phone push without hardcoding a provider).
# {level} {title} {detail} are substituted. Empty = no push. Runs via cmd /c, hidden, fire-and-forget.
#   Pushover : pushCommand=curl -s -F "token=APP" -F "user=USER" -F "message={level}: {title} {detail}" https://api.pushover.net/1/messages.json
#   ntfy.sh  : pushCommand=curl -s -H "Title: Sentinel {level}" -d "{title} {detail}" https://ntfy.sh/YOUR_TOPIC
#   Slack    : pushCommand=curl -s -X POST -H "Content-type: application/json" --data "{\"text\":\"Sentinel {level}: {title} {detail}\"}" https://hooks.slack.com/services/XXX
pushCommand=

# run pushCommand on INFO too (default: Critical only)
pushOnInfo=false
