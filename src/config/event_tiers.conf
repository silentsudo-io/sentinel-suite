# =============================================================================
#  Sentinel · news event TIERS  —  the blackout window per event class.
#  ---------------------------------------------------------------------------
#  ONE source of truth for both:
#    • Sentinel\News\ff_scrape.py        (bakes the window into the history JSONL)
#    • SentinelNewsService (C#, Phase 2) (must adopt these SAME tiers so LIVE and
#                                          REPLAY use identical windows — the whole
#                                          point: a backtest that matches live)
#
#  FORMAT (first match wins, top to bottom):
#     TIER | beforeMin | afterMin | semicolon;separated;name;substrings
#  Matching is case-insensitive substring on the FF event name.
#  The final rule with an EMPTY pattern is the catch-all (every other red event).
#
#  RATIONALE
#    A-tier = regime-movers: the market repositions for 30–60 min around them and
#             live you simply do not trade the window. Widest blackout.
#    B-tier = high-impact prints that spike then normalize inside ~30 min.
#    C-tier = the long tail of red-folder events (speeches, second-tier prints):
#             real, but a tight window is enough.
# =============================================================================

# --- A: FOMC / rate decision / CPI / NFP / Fed chair --------------------------
A | 60 | 60 | FOMC;Federal Funds Rate;Fed Chair;Fed Chairman;Press Conference;Economic Projections;Rate Decision
A | 30 | 45 | CPI;Consumer Price;Non-Farm Employment;Non-Farm Payroll;Nonfarm

# --- B: high-impact prints (spike then normalize) ----------------------------
B | 15 | 30 | PPI;Producer Price;PCE;Core PCE;ISM;Retail Sales;GDP;Unemployment Rate;Unemployment Claims;JOLTS;ADP;Employment Cost;Average Hourly;Consumer Sentiment;Consumer Confidence;Durable Goods;Trade Balance;Manufacturing PMI;Services PMI

# --- C: catch-all (speeches, second-tier red) --------------------------------
C |  5 | 10 |
