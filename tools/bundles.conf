# bundles.conf — which bundles each bundle REQUIRES.
#
# WHAT A BUNDLE IS, now that the whole suite is public: an install unit, not a silo.
# `deck` genuinely uses the Copier and Risk services; pretending otherwise would mean
# either duplicating their files (⛔ NinjaTrader compiles all of bin\Custom into ONE
# assembly, so a user installing two bundles that both carry SentinelCopierService gets
# CS0101 duplicate-class and their whole tree stops compiling — strictly worse than the
# CS0246 this file exists to prevent) or pushing everything into runtime/ until "runtime"
# means nothing.
#
# THE PROPERTY THIS PRESERVES: a documented install compiles. `check_bundle_deps.py`
# verifies the CLOSURE — the bundle plus its declared requirements, transitively, plus
# runtime/ — defines every custom top-level type the bundle references.
#
# FORMAT   bundle = dep, dep, ...       (direct requirements only; transitive is computed)
#          A bundle with no line here requires nothing beyond runtime/.
#          `runtime` is implicit for every bundle — do not list it.
#
# ⚠ ADDING AN EDGE IS A REAL DECISION. It means anyone installing the left bundle must
#   also install the right one. Prefer moving a genuinely universal type into runtime/
#   over adding an edge that makes half the suite a prerequisite for a small tool.
#
# ⛔ AN UNUSED DECLARATION IS REPORTED BUT NOT FATAL, on purpose. The checker matches
#   TYPES, so a partial-class METHOD dependency (e.g. `SentinelCore.GateEntry`) is
#   invisible to it — a declared edge it cannot see the need for may still be real.
#   Read the note, do not reflexively delete the line.

# The Dashboard/Deck surface is the suite's front end: it reads the Copier's config, the
# Excursion recorder, the Lens, the Log, and the Alert/Arc/News/Risk services.
deck       = copier, prop-kit, recorder, observatory

# SentinelStateService persists Copier config and Excursion state.
prop-kit   = copier, recorder

# SentinelTrendStrategy consumes the SentinelTrend sensor.
strategies = sensors
