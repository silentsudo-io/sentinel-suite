# Which renderer owns which published docs/*.html page.
#
# WHY THIS FILE EXISTS
#   Two renderers produce the pages in docs\. They emit the SAME chrome — head, watermark, kicker,
#   footer — because render_doc lifts its wrapper from an md2atlas page. Only the BODY differs. So
#   comparing the <head> of a page tells you nothing about which tool made it, and re-rendering with
#   the wrong one silently rewrites the whole body. On 2026-08-08 that cost two full revert cycles;
#   the giveaway was a 327-line diff for a 26-line source change.
#   ⇒ DIFF SIZE IS THE TELL. A cosmetic rewrite means you used the wrong renderer. Check here first.
#
# WHY THEY WERE NOT CONVERGED (measured 2026-08-08, and the measurement refused it)
#   Converging the five render_doc pages onto md2atlas was attempted and REVERTED. Proof was a
#   tag-stripped text diff of every page before and after, and it showed md2atlas is not a drop-in:
#     * it ate the asterisks in `Excursions\ticks\*.jsonl` as an emphasis span straddling two code
#       spans — a corrupted file path plus malformed nesting  (ROOT CAUSE NOW FIXED in md2atlas)
#     * it mangled pipes and backticks inside a table cell in SENTINEL_DESIGN_SYSTEM
#   The first is fixed. The second is not, so convergence stays OPEN, not decided. Re-attempt only
#   with the same text-diff proof — a convergence you cannot prove is content-neutral is a rewrite.
#
# FORMAT   <doc-stem> <renderer>
#   md2atlas    Sentinel\tools\md2atlas.py       — numbered sections, .lede, .tblwrap scroll wrappers
#   render_doc  Sentinel\Lab\docs\render_doc.py  — plain markdown body, <h1 id=…>, no token substitution
#   handwritten no source .md; NEVER regenerate — editing the .html IS editing the document
#
# ⚠ render_doc pages have NO .tblwrap wrappers, so their tables do not get overflow-x:auto.
#   19 tables across those five pages can push a narrow viewport sideways. That is the open defect
#   convergence was meant to close.

PRODUCT_LADDER                  render_doc
ROADMAP                         render_doc
SENTINEL_DATA_PLATFORM_SPEC     render_doc
SENTINEL_DESIGN_SYSTEM          render_doc
SENTINEL_DOCS                   render_doc

SENTINEL_PROCESS_ATLAS          handwritten

